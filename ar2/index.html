<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اسم · فعل · حرف</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
:root{--u:1.3;--bg:#faf8f3;--sf:#fff;--tx:#1d2a26;--mu:#6b7770;--bd:#ddd8cc;--ac:#0f6b5c;--ism:#1b5fa8;--fil:#a8431b;--hrf:#7a4fa3;--ok:#1f8a4c;--no:#c0392b;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--sf:#1b2420;--tx:#e8eee9;--mu:#92a199;--bd:#2c3833;--ac:#3fb59f;--ism:#6ba8ee;--fil:#f08a5c;--hrf:#b995e0;--ok:#4cc27e;--no:#ec6b5c}}
html{color-scheme:light dark;font-size:calc(16px*var(--u))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:640px;margin:0 auto;padding:.8rem}
button{font:inherit;cursor:pointer;border:2px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:.8rem;padding:.7rem}
button:disabled{opacity:.35;cursor:default}
.top{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin-bottom:.6rem}
.dot{width:2.2rem;height:2.2rem;padding:0;border-radius:50%;font-size:.8rem}
.dot.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sz{display:flex;align-items:center;gap:.3rem;font-size:.8rem;color:var(--mu);margin-left:auto}
.sz input{width:5rem}
.top label{font-size:.8rem;color:var(--mu);display:flex;align-items:center;gap:.25rem}
.card{background:var(--sf);border:2px solid var(--bd);border-radius:1rem;padding:.8rem;margin-bottom:.6rem;text-align:center}
.rule{font-size:1.1rem;font-weight:600}
.ar{font-family:"Amiri Quran","Traditional Arabic",serif;direction:rtl;unicode-bidi:isolate}
.rule .ar{font-size:1.5rem}
progress{width:100%;height:.5rem;accent-color:var(--ac);margin-top:.5rem}
.ayah{direction:rtl;display:flex;flex-wrap:wrap;gap:.2rem .6rem;justify-content:center;font-family:"Amiri Quran","Traditional Arabic",serif;font-size:2rem;line-height:2.2}
.w{padding:0 .4rem;border-radius:.6rem;border:3px solid transparent}
.w.t{background:color-mix(in srgb,var(--ac) 18%,transparent);border-color:var(--ac)}
.w.good{background:color-mix(in srgb,var(--ok) 28%,transparent);border-color:var(--ok)}
.w.bad{background:color-mix(in srgb,var(--no) 28%,transparent);border-color:var(--no)}
.gloss{display:none;color:var(--mu)}body.gl .gloss{display:block}
.ans{display:grid;gap:.5rem}
.ans button{font-family:"Amiri Quran",serif;font-size:2rem;min-height:4.5rem;line-height:1.2}
.ans small{display:block;font:.7rem system-ui;color:var(--mu)}
#n{border-color:var(--ism);color:var(--ism)}#v{border-color:var(--fil);color:var(--fil)}#h{border-color:var(--hrf);color:var(--hrf)}
.fb{min-height:4rem;text-align:center;margin-top:.6rem}
.fb b{font-size:1.3rem}.fb.ok b{color:var(--ok)}.fb.no b{color:var(--no)}
.fb button{margin:.4rem .2rem 0;min-width:7rem}
</style></head>
<body><main id="app"></main>
<script>
// token = arabic:tag:gloss ; n=اسم v=فعل h=حرف
const RAW=[
["1:2","ٱلْحَمْدُ:n:the_praise لِلَّهِ:n:for_Allah رَبِّ:n:Lord ٱلْعَـٰلَمِينَ:n:the_worlds"],
["1:3-4","ٱلرَّحْمَـٰنِ:n:the_Most_Gracious ٱلرَّحِيمِ:n:the_Most_Merciful مَـٰلِكِ:n:Owner يَوْمِ:n:day ٱلدِّينِ:n:the_Judgement"],
["1:5","إِيَّاكَ:n:You_alone نَعْبُدُ:v:we_worship وَإِيَّاكَ:n:and_You_alone نَسْتَعِينُ:v:we_seek_help"],
["1:6","ٱهْدِنَا:v:guide_us ٱلصِّرَٰطَ:n:the_path ٱلْمُسْتَقِيمَ:n:the_straight"],
["112:1","قُلْ:v:say هُوَ:n:He ٱللَّهُ:n:Allah أَحَدٌ:n:One"],
["112:3","لَمْ:h:not يَلِدْ:v:He_begets وَلَمْ:h:and_not يُولَدْ:v:is_begotten"],
["114:1","قُلْ:v:say أَعُوذُ:v:I_seek_refuge بِرَبِّ:n:in_the_Lord ٱلنَّاسِ:n:mankind"],
["114:2-3","مَلِكِ:n:King ٱلنَّاسِ:n:mankind إِلَـٰهِ:n:God ٱلنَّاسِ:n:mankind"],
["108:1","إِنَّآ:h:indeed_We أَعْطَيْنَـٰكَ:v:We_have_given_you ٱلْكَوْثَرَ:n:al-Kawthar"],
["108:2","فَصَلِّ:v:so_pray لِرَبِّكَ:n:to_your_Lord وَٱنْحَرْ:v:and_sacrifice"],
["103:2","إِنَّ:h:indeed ٱلْإِنسَـٰنَ:n:the_human لَفِى:h:surely_in خُسْرٍ:n:loss"],
["103:3","ٱلَّذِينَ:n:those_who ءَامَنُوا۟:v:believed وَعَمِلُوا۟:v:and_did ٱلصَّـٰلِحَـٰتِ:n:the_good_deeds وَتَوَاصَوْا۟:v:and_advised_each_other بِٱلْحَقِّ:n:with_the_truth"],
["96:1","ٱقْرَأْ:v:read بِٱسْمِ:n:in_the_name_of رَبِّكَ:n:your_Lord ٱلَّذِى:n:the_One_who خَلَقَ:v:created"],
["87:1","سَبِّحِ:v:glorify ٱسْمَ:n:name رَبِّكَ:n:your_Lord ٱلْأَعْلَى:n:the_Most_High"],
["93:3","مَا:h:not وَدَّعَكَ:v:has_forsaken_you رَبُّكَ:n:your_Lord وَمَا:h:and_not قَلَىٰ:v:detested"],
["55:13","فَبِأَىِّ:n:so_which ءَالَآءِ:n:favours رَبِّكُمَا:n:your_Lord تُكَذِّبَانِ:v:you_both_deny"],
["20:25-26","قَالَ:v:he_said رَبِّ:n:my_Lord ٱشْرَحْ:v:expand لِى:h:for_me صَدْرِى:n:my_chest وَيَسِّرْ:v:and_ease لِىٓ:h:for_me أَمْرِى:n:my_affair"],
["2:286","لَا:h:not يُكَلِّفُ:v:burdens ٱللَّهُ:n:Allah نَفْسًا:n:a_soul إِلَّا:h:except وُسْعَهَا:n:its_capacity"],
["2:255","ٱللَّهُ:n:Allah لَآ:h:no إِلَـٰهَ:n:god إِلَّا:h:except هُوَ:n:He ٱلْحَىُّ:n:the_Ever-Living ٱلْقَيُّومُ:n:the_Sustainer"],
["2:2","ذَٰلِكَ:n:that ٱلْكِتَـٰبُ:n:the_Book لَا:h:no رَيْبَ:n:doubt فِيهِ:h:in_it"],
["—","كَتَبَ:v:wrote ٱلطَّالِبُ:n:the_student ٱلدَّرْسَ:n:the_lesson"],
["—","يَقْرَأُ:v:reads ٱلْوَلَدُ:n:the_boy كِتَابًا:n:a_book"],
["—","ٱلْوَلَدُ:n:the_boy فِى:h:in ٱلْبَيْتِ:n:the_house"]
];
const AY=RAW.map(([r,s])=>({r,q:r!=='—',ws:s.split(' ').map(k=>{const p=k.split(':');return{w:p[0],t:p[1],g:p[2].replace(/_/g,' ')}})}));
const R1=/ٱل|[ًٌٍ]ا?$/, PRE=/^[يتنأ]/;
const ITEMS=[];AY.forEach((a,i)=>a.ws.forEach((x,j)=>ITEMS.push({id:i+'.'+j,a:i,j,t:x.t,w:x.w,s:x.w.replace(/^[وف][\u064B-\u0652\u0670]*/,'')})));
const LBL={n:'اسم',v:'فعل',h:'حرف'},EN={n:'noun',v:'verb',h:'particle'};
// 5 rules, one per stage
const ST=[
 {rule:'<span class="ar">ٱل &nbsp; ـٌ &nbsp; ـً &nbsp; ـٍ</span> = اسم',b:['n','v'],f:i=>i.t==='v'||(i.t==='n'&&R1.test(i.w))},
 {rule:'<span class="ar">ي &nbsp; ت &nbsp; ن &nbsp; أ</span> … = فعل',b:['n','v'],f:i=>(i.t==='v'&&PRE.test(i.s))||(i.t==='n'&&!PRE.test(i.s))},
 {rule:'<span class="ar">ـوا &nbsp; ـنَا &nbsp; ـتُ &nbsp; ٱ…</span> = فعل',b:['n','v'],f:i=>(i.t==='v'&&!PRE.test(i.s))||(i.t==='n'&&!PRE.test(i.s))},
 {rule:'<span class="ar">في من على إلى لا لم ما إن إلا و ب ل</span> = حرف',b:['n','v','h'],f:i=>true},
 {rule:'اسم = thing · فعل = action · حرف = link',b:['n','v','h'],f:i=>true}
];
const NEED=6;
let S={u:1.3,gl:0,lvl:0,max:0,p:[0,0,0,0,0],m:{}};
try{const x=localStorage.getItem('sfh2');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem('sfh2',JSON.stringify(S))}catch(e){}};
document.documentElement.style.setProperty('--u',S.u);
document.body.classList.toggle('gl',!!S.gl);
const app=document.getElementById('app');let cur=null,locked=false;
function sz(v){S.u=+v;document.documentElement.style.setProperty('--u',v);save()}
function gl(on){S.gl=on?1:0;document.body.classList.toggle('gl',on);save()}
function go(i){if(i>S.max)return;S.lvl=i;save();next()}
function pick(){const pool=ITEMS.filter(ST[S.lvl].f);let p=pool.filter(i=>!cur||i.id!==cur.id);if(!p.length)p=pool;
 const w=p.map(i=>1+3*(S.m[i.id]||0));let r=Math.random()*w.reduce((a,b)=>a+b,0);
 for(let k=0;k<p.length;k++){r-=w[k];if(r<=0)return p[k]}return p[0]}
function next(){locked=false;cur=pick();const st=ST[S.lvl],a=AY[cur.a],g=a.ws[cur.j].g;
 app.innerHTML=`<div class="top">${ST.map((_,i)=>`<button class="dot${i===S.lvl?' on':''}" ${i>S.max?'disabled':''} onclick="go(${i})">${i+1}</button>`).join('')}
 <label class="sz">A<input type="range" min="1" max="2" step=".1" value="${S.u}" oninput="sz(this.value)">A</label>
 <label><input type="checkbox" ${S.gl?'checked':''} onchange="gl(this.checked)">EN</label></div>
 <div class="card"><div class="rule">${st.rule}</div><progress max="${NEED}" value="${Math.min(S.p[S.lvl],NEED)}"></progress></div>
 <div class="card"><div class="ayah">${a.ws.map((x,j)=>`<span class="w${j===cur.j?' t':''}">${x.w}</span>`).join('')}</div><div class="gloss">${g}</div></div>
 <div class="ans" style="grid-template-columns:repeat(${st.b.length},1fr)">${st.b.map(t=>`<button id="${t}" onclick="ans('${t}')">${LBL[t]}<small>${EN[t]}</small></button>`).join('')}</div>
 <div class="fb" id="fb"></div>`}
function ans(t){if(locked)return;locked=true;const ok=t===cur.t,g=AY[cur.a].ws[cur.j].g;
 if(ok){S.p[S.lvl]++;S.m[cur.id]=Math.max(0,(S.m[cur.id]||0)-1)}else S.m[cur.id]=(S.m[cur.id]||0)+2;
 let up='';if(S.p[S.lvl]>=NEED&&S.lvl<ST.length-1){S.max=Math.max(S.max,S.lvl+1);up=`<button onclick="go(${S.lvl+1})">Next rule →</button>`}
 save();const fb=document.getElementById('fb');fb.className='fb '+(ok?'ok':'no');
 fb.innerHTML=`<b>${ok?'✓':'✗'} ${LBL[cur.t]}</b> · ${g}<br><button onclick="next()">Next</button>${up}`;
 document.querySelector('.w.t').classList.add(ok?'good':'bad');
 document.querySelector('progress').value=Math.min(S.p[S.lvl],NEED)}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(!locked&&ST[S.lvl].b.includes(k))ans(k);else if(locked&&(e.key==='Enter'||e.key===' ')){e.preventDefault();next()}});
next();
</script></body></html>
